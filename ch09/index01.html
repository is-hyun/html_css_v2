<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Clone Coding</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <span class="logo">GitHub</span>
      <input type="text" placeholder="Search" />
    </header>

    <main>
      <aside class="profile">
        <img class="profile-img" src="https://picsum.photos/seed/profile/200/200" alt="프로필 이미지" />
        <h2 class="username">Kim-coding</h2>
        <p class="userid">@kim-coding</p>
        <p class="desc">풀스택 개발자를 꿈꾸며 매일 커밋합니다</p>
        <p class="profile-info"><strong>42</strong> followers <span>·</span> <strong>18</strong> following</p>
        <div class="skill-badge">
          <span class="badge html">HTML</span>
          <span class="badge css">CSS</span>
          <span class="badge js">JavaScript</span>
        </div>
      </aside>
      <section class="main-content">
        <div class="content">
          <h3 class="content-name">잔디밭 (Contribution Graph)</h3>
          <div class="grass-grid">
            <!-- 라인 1 -->
            <div class="grass level-0"></div>
            <div class="grass level-2"></div>
            <div class="grass level-1"></div>
            <div class="grass level-2"></div>
            <div class="grass level-1"></div>
            <div class="grass level-0"></div>
            <!-- 라인 1 -->
            <div class="grass level-1"></div>
            <div class="grass level-0"></div>
            <div class="grass level-2"></div>
            <div class="grass level-1"></div>
            <div class="grass level-2"></div>
            <div class="grass level-0"></div>
          </div>
        </div>
        <div class="content">
          <h3 class="content-name">저장소 (Repositories)</h3>
          <div class="repo-card">
            <h4 class="repo-name">html-css-clone</h4>
            <p class="repo-desc">HTML/CSS 클론 코딩 프로젝트</p>
            <p class="repo-badge">
              <span class="lang-dot html-dot">●</span>
              HTMl
              <span class="etc">별 112</span>
            </p>
          </div>
          <div class="repo-card">
            <h4 class="repo-name">todo-app</h4>
            <p class="repo-desc">할 일 관리 앱</p>
            <p class="repo-badge">
              <span class="lang-dot js-dot">●</span>
              JavaScript
              <span class="etc">별 8</span>
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
