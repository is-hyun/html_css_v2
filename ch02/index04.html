<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인스타그램 프로필</title>
    <style>
      h1 {
        font-style: italic;
      }
      img.profile {
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <!-- header -->
    <header>
      <h1>Instagram</h1>
    </header>

    <!-- main -->
    <main>
      <!-- 프로필 영역 -->
      <section>
        <img class="profile" src="https://picsum.photos/150/150" alt="대체텍스트" />
        <h2>lee_coding</h2>
        <p>
          <span><strong>12</strong> 게시물 </span> | <span><strong>328</strong> 팔로워 </span> |
          <span><strong>156</strong> 팔로잉 </span>
        </p>
      </section>

      <!-- 소개 영역 -->
      <section>
        <p><strong>이코딩</strong></p>
        <p>웹 개발 공부 중</p>
        <p>HTML/CSS 마스터 배우기</p>
        <p>
          <a href="https://github.com/" target="_blank">https://github.com/lee-coding</a>
        </p>
      </section>

      <!-- 게시물 영역 -->
      <section>
        <h3>게시물</h3>
        <div>
          <img src="https://picsum.photos/seed/post1/150/150" alt="대체텍스트" />
          <img src="https://picsum.photos/seed/post2/150/150" alt="대체텍스트" />
          <img src="https://picsum.photos/seed/post3/150/150" alt="대체텍스트" />
          <img src="https://picsum.photos/seed/post4/150/150" alt="대체텍스트" />
          <img src="https://picsum.photos/seed/post5/150/150" alt="대체텍스트" />
          <img src="https://picsum.photos/seed/post6/150/150" alt="대체텍스트" />
        </div>
      </section>
    </main>

    <!-- footer -->
    <footer>
      <p>&copy; Instagram All rights reserved.</p>
    </footer>
  </body>
</html>
